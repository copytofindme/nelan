<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Video</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }

    /* ─── Видео ─── */
    video {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      object-fit: contain;
      pointer-events: none;
    }
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel { display:none !important; }

    /* ─── Блокирующий оверлей (мешает паузить) ─── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
    }

    /* ─── Стартовый экран с кнопкой ПОСТЫ ─── */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #start-screen.gone { display: none; }

    /* ─── Кнопка «Лан» — изначально скрыта снизу ─── */
    #lan-btn {
      position: fixed;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);

      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0088cc;
      color: #fff;
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-decoration: none;
      padding: clamp(14px, 4vw, 20px) clamp(40px, 12vw, 80px);
      border-radius: 50px;
      white-space: nowrap;
      box-shadow: 0 6px 30px rgba(0,136,204,0.65);
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.03em;
    }
    #lan-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* ─── Общие стили кнопок ─── */
    .tg-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #0088cc;
      color: #fff;
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-decoration: none;
      padding: clamp(16px, 4.5vw, 22px) clamp(36px, 11vw, 80px);
      border-radius: 50px;
      white-space: nowrap;
      box-shadow: 0 6px 28px rgba(0,136,204,0.6);
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.04em;
      cursor: pointer;
      border: none;
    }
    .tg-btn svg {
      width: clamp(22px, 6vw, 28px);
      height: clamp(22px, 6vw, 28px);
      flex-shrink: 0;
    }
    .tg-btn:active { filter: brightness(0.88); }
  </style>
</head>
<body>

  <video id="vid" src="video.mp4" preload="auto" playsinline webkit-playsinline disablepictureinpicture></video>

  <div id="overlay"></div>

  <!-- Стартовый экран: кнопка ПОСТЫ -->
  <div id="start-screen">
    <button class="tg-btn" id="posts-btn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.93 3.24L18.42 19.65C18.17 20.77 17.5 21.05 16.56 20.52L11.56 16.87L9.15 19.18C8.88 19.45 8.65 19.67 8.12 19.67L8.48 14.57L17.81 6.17C18.22 5.81 17.72 5.61 17.17 5.97L5.67 13.18L0.74 11.63C-0.36 11.28 -0.38 10.54 0.98 9.99L20.49 2.06C21.41 1.72 22.21 2.28 21.93 3.24Z" fill="white"/>
      </svg>
      ПОСТЫ
    </button>
  </div>

  <!-- Кнопка «Лан» появляется после 2-го просмотра -->
  <a id="lan-btn" href="https://t.me/+ce7fl6Glt09jOTIy">Лан</a>

  <script>
    const vid        = document.getElementById('vid');
    const startScreen = document.getElementById('start-screen');
    const postsBtn   = document.getElementById('posts-btn');
    const lanBtn     = document.getElementById('lan-btn');
    let count = 0;

    // Нажатие ПОСТЫ → запускаем видео со звуком
    function launchVideo() {
      vid.volume = 1.0;
      vid.muted  = false;
      vid.play().then(() => {
        startScreen.classList.add('gone');
      }).catch(() => {
        vid.muted = true;
        vid.play().then(() => {
          vid.muted  = false;
          vid.volume = 1.0;
          startScreen.classList.add('gone');
        });
      });
    }

    postsBtn.addEventListener('click',      launchVideo, { once: true });
    postsBtn.addEventListener('touchstart', launchVideo, { once: true, passive: true });

    // После каждого окончания видео
    vid.addEventListener('ended', () => {
      count++;
      // Видео продолжает крутиться бесконечно
      vid.currentTime = 0;
      vid.play();
      // После 2-го просмотра показываем кнопку «Лан»
      if (count >= 2) {
        lanBtn.classList.add('show');
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>

</body>
</html>
