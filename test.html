<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { margin:0; background:#000; overflow:hidden; }
    video { width:100vw; height:100vh; object-fit:contain; }
  </style>
</head>
<body>
  <video id="test-vid" autoplay muted loop playsinline webkit-playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
  <script>
    const v = document.getElementById('test-vid');
    v.muted = true;
    v.play().catch(() => {});
  </script>
</body>
</html>
